<header id="mapHeader">
 <h1 id="cityHeading">Карта</h1>
 <div class="toolbar">
  <button id="back" class="icon-button" aria-label="Назад"><svg><use href="#i-back"/></svg></button>
  <div id="searchRow" class="search"><input id="search" placeholder="Корпус, аудитория" autocomplete="off" aria-label="Поиск аудитории или корпуса"><button id="clearSearch" class="icon-button" aria-label="Очистить поиск"><svg><use href="#i-close"/></svg></button></div>
  <h1 id="context" hidden>План корпуса</h1>
  <button id="openSearch" class="icon-button" aria-label="Поиск аудитории" hidden><svg><use href="#i-search"/></svg></button>
  <button id="locate" class="icon-button" aria-label="Где я"><svg><use href="#i-locate"/></svg></button>
  <button id="allBuildings" class="icon-button" aria-label="Вписать все"><svg><use href="#i-fit"/></svg></button>
  <button id="moreRoute" class="icon-button" aria-label="Ещё" aria-expanded="false" aria-controls="routeMenu" hidden>⋮</button>
 </div>
 <div id="routeMenu" hidden><button id="rotateMenu">Повернуть план</button><button id="setAnchor">Я здесь</button><button id="calibrateHeight" hidden>Откалибровать барометр</button><button id="endRoute" hidden>Завершить маршрут</button></div>
 <p id="floorSubtitle" hidden></p><div id="indoorControls" hidden><div id="buildings" aria-label="Корпуса"></div></div>
</header>
<div id="results" role="region" aria-label="Результаты поиска" hidden></div>
<button id="mapNotice" aria-live="polite" hidden></button>
<section id="cityStage" aria-label="Карта Ульяновска">
 <div id="cityMap" aria-label="Карта корпусов"></div>
 <div class="city-controls"><button id="cityZoomIn" aria-label="Приблизить">+</button><button id="cityZoomOut" aria-label="Отдалить">−</button></div>
</section>
<section id="indoorView" aria-label="План корпуса" hidden><div id="mapStage"><div id="map"></div></div><div id="floors" aria-label="Этажи"></div></section>
<div id="positionNotice" hidden>GPS не определяет этаж и кабинет. Выбери этаж вручную.</div><div id="toast" role="status" hidden></div>
<section id="sheet" aria-label="Маршрут" hidden>
 <div id="cityCard" hidden>
  <div class="building-kicker">Корпус УлГТУ</div><h2 id="roomTitle"></h2><p id="buildingAddress"></p><p id="cityRoomNote" hidden></p>
  <div id="routeSummary" role="status"></div><div id="cityTrip" hidden><div><strong id="tripTime"></strong><small>Время в пути</small></div><div><strong id="tripDistance"></strong><small>Расстояние</small></div></div>
  <div class="actions"><button id="previewPlan">Открыть план</button><button id="insideRoute" hidden>Внутри корпуса</button><button id="goHere" class="primary"><span id="routeButtonText">Маршрут</span></button></div>
  <div class="actions"><button id="gpsSettings" hidden>Разрешить геолокацию</button><button id="endCityRoute" hidden>Завершить</button><button id="fitRoute" aria-label="Показать весь маршрут" hidden><svg><use href="#i-fit"/></svg></button></div>
 </div>
 <div id="planCard" hidden>
  <div id="planBar"><button id="sheetHandle" aria-expanded="false"></button><button id="indoorRoute" class="primary">Маршрут</button></div>
  <div id="roomCard" hidden><strong id="indoorRoomName"></strong><small id="indoorRoomFloor"></small><div class="actions">
   <button id="roomRoute" class="primary">Маршрут</button><button id="favouriteRoom" aria-label="Добавить в избранное">☆</button>
  </div><div class="actions"><button id="roomCityRoute" hidden>Пешком до входа</button>
  </div></div>
  <div id="routeStepper" hidden><div id="routeSteps" role="status"></div><div id="routeHint"></div><ol id="routeList" hidden></ol><div class="actions"><button id="allSteps">Шаги</button><button id="previousFloor">Назад</button><button id="nextFloor" class="primary">Далее</button></div></div>
  <div id="planExtra" hidden><p id="buildingUnits"></p><button id="planSearch">Поиск аудиторий</button><button id="planSources">Источники данных</button><button id="rotatePlan">Повернуть</button></div>
  <p id="heightStatus" role="status" hidden></p>
 </div>
</section>
